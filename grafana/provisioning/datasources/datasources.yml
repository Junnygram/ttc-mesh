apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: Tempo

  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: Tempo
          urlDisplayLabel: View trace

  - name: Tempo
    uid: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: Prometheus
      tracesToLogsV2:
        datasourceUid: Loki
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name=~"ttc-.+"} |= "${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: Prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Sync latency
            query: histogram_quantile(0.99, sum by (le) (rate(ttc_collector_sync_duration_seconds_bucket{$$__tags}[5m])))
      lokiSearch:
        datasourceUid: Loki

  - name: Jaeger
    uid: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
