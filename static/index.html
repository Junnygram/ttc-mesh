<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Canada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
        :root {
            --ink: #111113;
            --sheet: #1C1C1E;
            --raised: #2C2C2E;
            --muted: #A1A1A6;
            --line: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; background: #141416; color: #fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
        #map { position: fixed; inset: 0; background: #1B1B1D; }
        button, input { font-family: inherit; }
        button { cursor: pointer; }

        .top {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 20;
            width: min(420px, calc(100vw - 28px));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .where {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: var(--ink);
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.28);
        }
        .mark {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #111;
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: -0.4px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .where input {
            flex: 1;
            border: 0;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-weight: 650;
            color: #111;
            min-width: 0;
        }
        .where input::placeholder { color: #8E8E93; font-weight: 550; }
        .icon-btn {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 11px;
            background: #F2F2F7;
            color: #111;
            font-size: 16px;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: #E5E5EA; }
        .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            border: 0;
            background: rgba(28,28,30,0.92);
            color: #fff;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 650;
            white-space: nowrap;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }
        .chip.on { background: #fff; color: #111; }
        .hint {
            display: none;
            background: rgba(28,28,30,0.92);
            color: #fff;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }
        .results {
            display: none;
            background: #fff;
            color: #111;
            border-radius: 16px;
            overflow: auto;
            max-height: 320px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.28);
        }
        .results.open { display: block; }
        .result {
            display: block;
            width: 100%;
            text-align: left;
            border: 0;
            background: #fff;
            padding: 10px 14px;
            cursor: pointer;
        }
        .result b { display: block; font-size: 15px; font-weight: 750; letter-spacing: -0.2px; }
        .result span { display: block; margin-top: 2px; color: #6E6E73; font-size: 12px; font-weight: 600; }
        .result.on, .result:hover { background: #F2F2F7; }
        .result.empty { color: #6E6E73; font-size: 14px; font-weight: 650; cursor: default; }

        .menu {
            display: none;
            position: absolute;
            top: 58px;
            left: 0;
            width: min(280px, calc(100vw - 28px));
            background: #1C1C1E;
            border-radius: 16px;
            padding: 6px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.45);
        }
        .menu.open { display: block; }
        .menu-label {
            padding: 10px 12px 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #8E8E93;
        }
        .menu a, .menu button.row {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            text-align: left;
            text-decoration: none;
            color: #fff;
            background: transparent;
            border: 0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
        }
        .menu a:hover, .menu button.row:hover { background: rgba(255,255,255,0.06); }
        .menu .sub { display: block; font-size: 12px; font-weight: 500; color: #8E8E93; margin-top: 2px; }

        .sheet, .ride {
            position: fixed;
            left: 50%;
            bottom: 16px;
            transform: translateX(-50%);
            width: min(440px, calc(100vw - 24px));
            z-index: 20;
            background: var(--sheet);
            border-radius: 22px;
            padding: 14px 16px 16px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.45);
        }
        .ride { display: none; }
        .grab {
            width: 36px;
            height: 4px;
            border-radius: 99px;
            background: rgba(255,255,255,0.22);
            margin: 0 auto 12px;
        }
        .sheet-head, .ride-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .count { font-size: 40px; font-weight: 800; letter-spacing: -1.4px; line-height: 1; }
        .count-label { margin-top: 4px; color: var(--muted); font-size: 14px; font-weight: 550; }
        .live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(48, 209, 88, 0.14);
            color: #30D158;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 750;
            letter-spacing: 0.04em;
        }
        .live.off { background: rgba(255,69,58,0.14); color: #FF453A; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
        .stat { background: var(--raised); border-radius: 14px; padding: 12px; }
        .stat b { display: block; font-size: 18px; font-weight: 750; letter-spacing: -0.3px; }
        .stat span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; font-weight: 600; }
        .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter {
            border: 0;
            background: var(--raised);
            color: #fff;
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 650;
            white-space: nowrap;
        }
        .filter.on { background: #fff; color: #111; }
        .cta {
            width: 100%;
            height: 50px;
            border: 0;
            border-radius: 14px;
            background: #fff;
            color: #111;
            font-size: 16px;
            font-weight: 750;
        }
        .cta:hover { background: #F2F2F7; }
        .cta:disabled { opacity: 0.45; cursor: default; }
        .ride-title { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
        .ride-sub { margin-top: 4px; color: #fff; font-size: 15px; font-weight: 700; }
        .ride-way { margin-top: 10px; font-size: 14px; font-weight: 650; letter-spacing: -0.2px; }
        .ride-stop { margin-top: 6px; color: #D1D1D6; font-size: 13px; font-weight: 650; }
        .ride-warn { margin-top: 8px; color: #FFD60A; font-size: 13px; font-weight: 550; line-height: 1.35; }
        .feed-age { display: none; margin-top: 6px; font-size: 11px; font-weight: 750; color: #FFD60A; text-align: right; }
        .feed-age.bad { color: #FF453A; }
        .close {
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: var(--raised);
            color: #fff;
            font-size: 14px;
        }

        .recenter {
            position: fixed;
            left: 50%;
            bottom: 248px;
            transform: translateX(-50%);
            z-index: 25;
            border: 0;
            background: #fff;
            color: #111;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 750;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }

        .waiting {
            position: fixed;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            z-index: 15;
            background: rgba(28,28,30,0.92);
            color: #fff;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 650;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            pointer-events: none;
        }

        .maplibregl-ctrl-logo { display: none !important; }
        .maplibregl-ctrl-bottom-left { bottom: 210px !important; left: 10px !important; }
        .maplibregl-ctrl-bottom-right { bottom: 210px !important; right: 10px !important; }
        .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.45) !important; color: #c7c7cc !important; font-size: 10px !important; }
        .maplibregl-ctrl-attrib a { color: #fff !important; }
        .maplibregl-ctrl-group { background: #1C1C1E !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.35) !important; }
        .maplibregl-ctrl-group button { filter: invert(1); }
        .maplibregl-ctrl-group button + button { border-top: 1px solid rgba(255,255,255,0.12) !important; }

        @media (max-width: 720px) {
            .top {
                top: max(8px, env(safe-area-inset-top));
                left: 8px;
                width: calc(100vw - 16px);
                gap: 6px;
            }
            .where { padding: 6px; border-radius: 14px; }
            .mark { width: 34px; height: 34px; border-radius: 10px; }
            .chip, .filter { padding: 8px 11px; }
            .sheet, .ride {
                left: 8px;
                right: 8px;
                width: auto;
                transform: none;
                bottom: max(8px, env(safe-area-inset-bottom));
                max-height: 42vh;
                overflow-y: auto;
                padding: 10px 12px 12px;
                border-radius: 18px;
            }
            .count { font-size: 32px; }
            .ride-title { font-size: 20px; }
            .ride-sub, .ride-way, .ride-warn { font-size: 13px; }
            .stats { margin: 10px 0; gap: 6px; }
            .stat { padding: 10px; }
            .cta { height: 46px; }
            .recenter { bottom: calc(42vh + 16px); }
            .maplibregl-ctrl-bottom-left,
            .maplibregl-ctrl-bottom-right { bottom: auto !important; top: 128px !important; }
            .maplibregl-ctrl-bottom-left { left: 8px !important; }
            .maplibregl-ctrl-bottom-right { right: 8px !important; }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="top">
        <div class="where">
            <div class="mark">CAN</div>
            <input id="search" type="text" placeholder="Search routes, stops, cities" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="results">
            <button id="clear" class="icon-btn" type="button" hidden aria-label="Clear">✕</button>
            <button id="menu-btn" class="icon-btn" type="button" aria-label="Menu">☰</button>
        </div>
        <div id="results" class="results" role="listbox"></div>
        <div class="chips" id="cities">
            <button class="chip on" type="button" data-city="Toronto">Toronto</button>
            <button class="chip" type="button" data-city="Montreal">Montreal</button>
            <button class="chip" type="button" data-city="Vancouver">Vancouver</button>
            <button class="chip" type="button" data-city="Victoria">Victoria</button>
            <button class="chip" type="button" data-city="Calgary">Calgary</button>
            <button class="chip" type="button" data-city="Ottawa">Ottawa</button>
            <button class="chip" type="button" data-city="Edmonton">Edmonton</button>
            <button class="chip" type="button" data-city="Winnipeg">Winnipeg</button>
            <button class="chip" type="button" data-city="Halifax">Halifax</button>
        </div>
        <div class="chips" id="chips">
            <button class="chip" type="button" data-route="504">504 King</button>
            <button class="chip" type="button" data-route="501">501 Queen</button>
            <button class="chip" type="button" data-route="510">510 Spadina</button>
            <button class="chip" type="button" data-route="506">506 Carlton</button>
            <button class="chip" type="button" data-route="29">29 Dufferin</button>
        </div>
        <div id="hint" class="hint"></div>
        <div id="menu" class="menu">
            <div class="menu-label">Meshery</div>
            <a href="http://localhost:9081" target="_blank" rel="noreferrer">Service mesh
                <span class="sub">Kanvas, Istio, mTLS</span>
            </a>
            <div class="menu-label">LGTM stack</div>
            <a href="http://localhost:3000/d/ttc-mesh-overview/toronto-transit-command-center-ttc-mesh" target="_blank" rel="noreferrer">Grafana
                <span class="sub">LGTM board</span>
            </a>
            <a href="http://localhost:3000/explore" target="_blank" rel="noreferrer">Loki and Tempo
                <span class="sub">Log line to trace, and back</span>
            </a>
            <a href="http://localhost:16686" target="_blank" rel="noreferrer">Jaeger
                <span class="sub">Traces</span>
            </a>
            <a href="http://localhost:9090" target="_blank" rel="noreferrer">Prometheus
                <span class="sub">Metrics</span>
            </a>
        </div>
    </div>

    <div class="sheet" id="sheet">
        <div class="grab"></div>
        <div class="sheet-head">
            <div>
                <div class="count" id="count">—</div>
                <div class="count-label" id="count-label">vehicles in Toronto</div>
            </div>
            <div class="live off" id="live"><span class="dot"></span><span id="live-label">CONNECTING</span></div>
            <div id="feed-age" class="feed-age"></div>
        </div>
        <div class="stats">
            <div class="stat"><b id="moving">—</b><span>In motion</span></div>
            <div class="stat"><b id="speed">—</b><span>Avg speed</span></div>
        </div>
        <div class="filters">
            <button class="filter on" type="button" data-mode="all">All</button>
            <button class="filter" type="button" data-mode="streetcar">Streetcar</button>
            <button class="filter" type="button" data-mode="express">Express</button>
            <button class="filter" type="button" data-mode="bus">Bus</button>
        </div>
        <button class="cta" id="follow-btn" type="button">Follow a bus</button>
    </div>

    <div class="ride" id="ride">
        <div class="grab"></div>
        <div class="ride-head">
            <div>
                <div class="ride-title" id="ride-title">—</div>
                <div class="ride-sub" id="ride-sub">Live</div>
            </div>
            <button class="close" id="ride-close" type="button" aria-label="Stop following">✕</button>
        </div>
        <div class="ride-way" id="ride-way"></div>
        <div class="ride-stop" id="ride-stop"></div>
        <div class="ride-warn" id="ride-warn"></div>
        <div class="stats">
            <div class="stat"><b id="ride-speed">—</b><span>Speed</span></div>
            <div class="stat"><b id="ride-head">—</b><span>Direction</span></div>
        </div>
    </div>

    <button id="recenter" class="recenter" type="button" hidden>Re-center</button>
    <div id="waiting" class="waiting">Connecting to live transit…</div>

    <script>
        const HERO = { center: [-79.387, 43.6505], zoom: 16.35, pitch: 64, bearing: 28 };
        const FOLLOW_ZOOM = 17.15;
        const CITIES = {
            Toronto: { center: [-79.387, 43.6505], zoom: 16.35, pitch: 64, bearing: 28, live: true, agency: "TTC", routes: [
                { id: "504", label: "504 King" }, { id: "501", label: "501 Queen" }, { id: "510", label: "510 Spadina" },
                { id: "506", label: "506 Carlton" }, { id: "29", label: "29 Dufferin" }
            ]},
            Montreal: { center: [-73.5674, 45.5019], zoom: 16.2, pitch: 64, bearing: 20, live: false, agency: "STM", note: "STM publishes live positions behind a developer key." },
            Vancouver: { center: [-123.1207, 49.2827], zoom: 16.15, pitch: 66, bearing: -18, live: false, agency: "TransLink", note: "TransLink publishes live positions behind an API key. Victoria is the open British Columbia feed." },
            Victoria: { center: [-123.3656, 48.4284], zoom: 15.6, pitch: 62, bearing: 18, live: true, agency: "BC Transit", routes: [
                { id: "70", label: "70" }, { id: "61", label: "61" }, { id: "2", label: "2" }, { id: "75", label: "75" }
            ]},
            Calgary: { center: [-114.0719, 51.0447], zoom: 15.9, pitch: 62, bearing: 14, live: true, agency: "Calgary Transit", routes: [
                { id: "1", label: "1" }, { id: "3", label: "3" }, { id: "201", label: "201 Red" }, { id: "202", label: "202 Blue" }
            ]},
            Ottawa: { center: [-75.6972, 45.4215], zoom: 16.05, pitch: 62, bearing: 10, live: false, agency: "OC Transpo", note: "OC Transpo publishes live positions behind a subscription key." },
            Edmonton: { center: [-113.4938, 53.5461], zoom: 15.7, pitch: 60, bearing: 12, live: true, agency: "ETS", routes: [
                { id: "4", label: "4" }, { id: "8", label: "8" }, { id: "2", label: "2" }, { id: "5", label: "5" }, { id: "1", label: "1" }
            ]},
            Winnipeg: { center: [-97.1384, 49.8954], zoom: 15.7, pitch: 60, bearing: 8, live: false, agency: "Winnipeg Transit", note: "Winnipeg Transit does not publish a public vehicle feed." },
            Halifax: { center: [-63.5752, 44.6488], zoom: 15.9, pitch: 62, bearing: 32, live: true, agency: "Halifax Transit", routes: [
                { id: "1", label: "1" }, { id: "2", label: "2" }, { id: "3", label: "3" }, { id: "8", label: "8" }, { id: "10", label: "10" }
            ]}
        };
        const ROUTE_NAMES = {
            "501": "Queen", "502": "Downtowner", "503": "Kingston Rd", "504": "King",
            "505": "Dundas", "506": "Carlton", "509": "Harbourfront", "510": "Spadina",
            "511": "Bathurst", "512": "St Clair", "29": "Dufferin", "35": "Jane",
            "36": "Finch West", "7": "Bathurst", "6": "Bay", "960": "Steeles Express",
            "939": "Finch Express", "52": "Lawrence West", "96": "Wilson"
        };

        const fleet = new Map();
        const collection = { type: "FeatureCollection", features: [] };
        let dirty = true;
        let mapLoaded = false;
        let followId = null;
        let userTookCamera = false;
        let cameraSettled = false;
        let lastCam = 0;
        let lastHud = 0;
        let filterMode = "all";
        let query = "";
        let picked = null;
        let resultHits = [];
        let resultIndex = 0;
        let activeCity = "Toronto";
        let agencyStatus = {};
        let activeCount = 0;
        let movingCount = 0;
        let avgSpeed = 0;

        const uberStyle = {
            version: 8,
            name: "Canada Aerial",
            glyphs: "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf",
            sources: {
                satellite: {
                    type: "raster",
                    tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
                    tileSize: 256,
                    maxzoom: 19,
                    attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
                },
                terrain: {
                    type: "raster-dem",
                    tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
                    encoding: "terrarium",
                    tileSize: 256,
                    maxzoom: 15
                },
                openmaptiles: {
                    type: "vector",
                    url: "https://tiles.openfreemap.org/planet",
                    attribution: "© OpenStreetMap © OpenFreeMap"
                }
            },
            terrain: { source: "terrain", exaggeration: 1.35 },
            sky: {
                "sky-color": "#9EC0DC",
                "horizon-color": "#E7EEF5",
                "fog-color": "#C9D7E6",
                "sky-horizon-blend": 0.52,
                "horizon-fog-blend": 0.62,
                "fog-ground-blend": 0.28,
                "atmosphere-blend": 0.8
            },
            layers: [
                { id: "background", type: "background", paint: { "background-color": "#1A1C24" } },
                { id: "satellite", type: "raster", source: "satellite", paint: { "raster-saturation": 0.05, "raster-contrast": 0.08 } },
                { id: "road-label", type: "symbol", source: "openmaptiles", "source-layer": "transportation_name", minzoom: 14.2,
                  filter: ["match", ["get", "class"], ["motorway", "trunk", "primary", "secondary", "tertiary"], true, false],
                  layout: {
                      "symbol-placement": "line",
                      "text-field": ["coalesce", ["get", "name:latin"], ["get", "name"]],
                      "text-font": ["Noto Sans Regular"],
                      "text-size": 12,
                      "text-letter-spacing": 0.04,
                      "text-max-angle": 28
                  },
                  paint: { "text-color": "#F7F7F8", "text-halo-color": "#111318", "text-halo-width": 1.6 } },
                { id: "city-label", type: "symbol", source: "openmaptiles", "source-layer": "place", minzoom: 3, maxzoom: 12,
                  filter: ["match", ["get", "class"], ["city", "town", "state"], true, false],
                  layout: {
                      "text-field": ["coalesce", ["get", "name:latin"], ["get", "name"]],
                      "text-font": ["Noto Sans Regular"],
                      "text-size": ["interpolate", ["linear"], ["zoom"], 3, 11, 6, 14, 10, 18]
                  },
                  paint: { "text-color": "#F7F7F8", "text-halo-color": "#111318", "text-halo-width": 1.6 } },
                { id: "place-label", type: "symbol", source: "openmaptiles", "source-layer": "place", minzoom: 12,
                  filter: ["match", ["get", "class"], ["neighbourhood", "suburb", "quarter"], true, false],
                  layout: {
                      "text-field": ["coalesce", ["get", "name:latin"], ["get", "name"]],
                      "text-font": ["Noto Sans Regular"],
                      "text-size": 13
                  },
                  paint: { "text-color": "#F7F7F8", "text-halo-color": "#111318", "text-halo-width": 1.5 } }
            ]
        };

        function plate(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function vehicleCanvas(kind) {
            const ratio = 2;
            const size = 32;
            const canvas = document.createElement("canvas");
            canvas.width = size * ratio;
            canvas.height = size * ratio;
            const ctx = canvas.getContext("2d");
            ctx.scale(ratio, ratio);
            const ring = kind === "streetcar" ? "#EA4335"
                : kind === "express" ? "#34A853"
                : kind === "stopped" ? "#80868B"
                : "#1A73E8";
            plate(ctx, 1, 1, size - 2, size - 2, 8);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = ring;
            ctx.stroke();

            const body = kind === "stopped" ? "#5F6368" : "#111111";
            plate(ctx, 8, 6, 16, 18, 3.5);
            ctx.fillStyle = body;
            ctx.fill();
            ctx.fillRect(5.5, 10, 2.2, 3.2);
            ctx.fillRect(24.3, 10, 2.2, 3.2);
            plate(ctx, 10.2, 8.2, 11.6, 7.2, 1.6);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(11.2, 22.2, 2.15, 0, Math.PI * 2);
            ctx.arc(20.8, 22.2, 2.15, 0, Math.PI * 2);
            ctx.fill();
            return canvas;
        }

        function classify(route) {
            const n = parseInt(route, 10);
            if ((n >= 501 && n <= 514) || [301, 304, 306, 310].includes(n)) return "streetcar";
            if (n >= 900 && n <= 999) return "express";
            return "bus";
        }

        function routeLabel(route, city) {
            const name = (city || activeCity) === "Toronto" ? ROUTE_NAMES[String(route)] : "";
            return name ? route + " " + name : (route ? "Route " + route : "Bus");
        }

        function modeLabel(mode) {
            if (mode === "streetcar") return "Streetcar";
            if (mode === "express") return "Express bus";
            return "Bus";
        }

        function vehicleCity(s) {
            return (s && s.city) || "Toronto";
        }

        function meters(lat1, lon1, lat2, lon2) {
            const dLat = (lat2 - lat1) * 111139;
            const dLon = (lon2 - lon1) * 111139 * Math.cos(lat1 * Math.PI / 180);
            return Math.hypot(dLat, dLon);
        }

        function heading(lat1, lon1, lat2, lon2) {
            if (meters(lat1, lon1, lat2, lon2) < 8) return null;
            const dLat = lat2 - lat1;
            const dLon = (lon2 - lon1) * Math.cos(lat1 * Math.PI / 180);
            return (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;
        }

        function compass(deg) {
            const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return dirs[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
        }

        function iconFor(s) {
            if (!s.moving) return "veh-stopped";
            if (s.mode === "streetcar" || s.mode === "train") return "veh-streetcar";
            if (s.mode === "express") return "veh-express";
            return "veh-bus";
        }

        function stopPlace(text) {
            return String(text || "").replace(/^(Arriving at|Stopped at|Next stop) /, "");
        }

        function matchesSearch(s) {
            if (picked) {
                if (picked.city && vehicleCity(s) !== picked.city) return false;
                if (picked.route && String(s.route) !== String(picked.route)) return false;
                if (picked.toward && (s.toward || "") !== picked.toward) return false;
                if (picked.stop && stopPlace(s.stop) !== picked.stop) return false;
                return true;
            }
            if (!query) return true;
            return String(s.route || "").toLowerCase() === query.toLowerCase();
        }

        function isVisible(s) {
            if (vehicleCity(s) !== activeCity && s.id !== followId) return false;
            if (s.id === followId) return true;
            if (filterMode !== "all" && s.mode !== filterMode) return false;
            if (!matchesSearch(s)) return false;
            if (s.id !== followId && !s.moving && mapLoaded && map.getZoom() < 15.6) return false;
            return true;
        }

        function sample(s, now) {
            const p = (now - s.t0) / s.dur;
            if (p >= 1) return { lat: s.bLat, lon: s.bLon };
            return {
                lat: s.aLat + (s.bLat - s.aLat) * p,
                lon: s.aLon + (s.bLon - s.aLon) * p
            };
        }

        function ingest(list, full) {
            const now = performance.now();
            const seen = new Set();
            for (const v of list || []) {
                const lat = Number(v.lat);
                const lon = Number(v.lon);
                if (!v.id || !isFinite(lat) || !isFinite(lon)) continue;
                const id = String(v.id);
                seen.add(id);
                const speed = Number(v.speed) || 0;
                const mode = v.mode || classify(v.route);
                let s = fleet.get(id);
                if (!s) {
                    s = {
                        id: id,
                        route: String(v.route || ""),
                        mode: mode,
                        city: v.city || "Toronto",
                        agency: v.agency || "",
                        speed: speed,
                        moving: speed > 0,
                        shownKmh: speed,
                        lat: lat,
                        lon: lon,
                        bearing: Number(v.bearing) || 0,
                        targetBearing: Number(v.bearing) || 0,
                        toward: v.toward || "",
                        compass: v.compass || "",
                        other: v.other || "",
                        stop: v.stop || "",
                        occupancy: v.occupancy || "",
                        shortTurn: !!v.short_turn,
                        alert: v.alert || "",
                        bunched: !!v.bunched,
                        aLat: lat, aLon: lon, bLat: lat, bLon: lon,
                        t0: now, dur: 1,
                        feature: {
                            type: "Feature",
                            properties: { id: id, route: String(v.route || ""), mode: mode, bearing: 0, icon: "veh-bus", show: 1 },
                            geometry: { type: "Point", coordinates: [lon, lat] }
                        }
                    };
                    fleet.set(id, s);
                    dirty = true;
                } else {
                    const dist = meters(s.lat, s.lon, lat, lon);
                    if (dist > 800) {
                        s.aLat = lat; s.aLon = lon; s.bLat = lat; s.bLon = lon; s.lat = lat; s.lon = lon;
                        s.t0 = now; s.dur = 1;
                    } else if (dist > 2) {
                        s.aLat = s.lat; s.aLon = s.lon;
                        s.bLat = lat; s.bLon = lon;
                        s.t0 = now; s.dur = 11000;
                        const h = heading(s.aLat, s.aLon, lat, lon);
                        if (h != null) s.targetBearing = h;
                    } else if (v.bearing) {
                        s.targetBearing = Number(v.bearing) || s.targetBearing;
                    }
                    s.speed = speed;
                    s.moving = speed > 0 || (dist > 8 && dist < 800);
                    if (dist > 2 && dist <= 800) {
                        s.shownKmh = (dist / 11) * 3.6;
                    } else if (speed <= 0) {
                        s.shownKmh = 0;
                    }
                    s.route = String(v.route || s.route);
                    s.mode = mode;
                    if (v.city) s.city = v.city;
                    if (v.agency) s.agency = v.agency;
                    if (v.toward) s.toward = v.toward;
                    if (v.compass) s.compass = v.compass;
                    if (v.other) s.other = v.other;
                    s.stop = v.stop || "";
                    s.occupancy = v.occupancy || "";
                    s.shortTurn = !!v.short_turn;
                    s.alert = v.alert || "";
                    s.bunched = !!v.bunched;
                }
            }
            if (full) {
                for (const id of fleet.keys()) {
                    if (!seen.has(id)) {
                        fleet.delete(id);
                        dirty = true;
                        if (id === followId) stopFollow(false);
                    }
                }
            }
            const waiting = document.getElementById("waiting");
            if (fleet.size > 0) waiting.hidden = true;
            paintSheet();
            const searchBox = document.getElementById("results");
            if (searchBox && searchBox.classList.contains("open")) {
                paintResults(document.getElementById("search").value);
            }
        }

        function tick(now) {
            if (mapLoaded) {
                const src = map.getSource("fleet");
                if (src) {
                    if (dirty) {
                        collection.features = [];
                        fleet.forEach(function (s) { collection.features.push(s.feature); });
                        dirty = false;
                    }
                    fleet.forEach(function (s) {
                        const pos = sample(s, now);
                        s.lat = pos.lat;
                        s.lon = pos.lon;
                        let diff = ((s.targetBearing - s.bearing + 540) % 360) - 180;
                        s.bearing = (s.bearing + diff * 0.16 + 360) % 360;
                        const coords = s.feature.geometry.coordinates;
                        coords[0] = s.lon;
                        coords[1] = s.lat;
                        s.feature.properties.bearing = s.bearing;
                        s.feature.properties.icon = iconFor(s);
                        s.feature.properties.mode = s.mode;
                        s.feature.properties.show = isVisible(s) ? 1 : 0;
                    });
                    src.setData(collection);
                    if (followId && !userTookCamera && cameraSettled && now - lastCam > 140) {
                        const s = fleet.get(followId);
                        if (s) {
                            lastCam = now;
                            map.easeTo({
                                center: [s.lon, s.lat],
                                bearing: s.bearing,
                                pitch: 64,
                                zoom: FOLLOW_ZOOM,
                                duration: 280,
                                easing: function (t) { return t; },
                                essential: true
                            });
                        }
                    }
                    if (followId && now - lastHud > 280) {
                        lastHud = now;
                        const s = fleet.get(followId);
                        if (s) paintRide(s);
                    }
                }
            }
            requestAnimationFrame(tick);
        }

        function cityFleet() {
            const rows = [];
            fleet.forEach(function (s) {
                if (vehicleCity(s) === activeCity) rows.push(s);
            });
            return rows;
        }

        function paintSheet() {
            const city = CITIES[activeCity] || {};
            const rows = cityFleet();
            let moving = 0;
            let speedSum = 0;
            let speedN = 0;
            rows.forEach(function (s) {
                if (!s.moving) return;
                moving += 1;
                const kmh = Number(s.shownKmh) || Number(s.speed) || 0;
                if (kmh > 0) {
                    speedSum += kmh;
                    speedN += 1;
                }
            });
            const count = document.getElementById("count");
            const label = document.getElementById("count-label");
            if (city.live === false) {
                count.textContent = "—";
                label.textContent = city.agency || activeCity;
            } else {
                count.textContent = rows.length ? rows.length.toLocaleString() : "—";
                label.textContent = "vehicles in " + activeCity;
            }
            document.getElementById("moving").textContent = city.live === false ? "—" : (rows.length ? moving.toLocaleString() : "—");
            document.getElementById("speed").textContent = speedN ? (speedSum / speedN).toFixed(1) + " km/h" : "—";
            const btn = document.getElementById("follow-btn");
            btn.disabled = city.live === false;
            if (city.live === false) btn.textContent = "Live feed needs a key";
            else if (filterMode === "streetcar") btn.textContent = activeCity === "Calgary" ? "Follow a train" : "Follow a streetcar";
            else if (filterMode === "express") btn.textContent = "Follow an express bus";
            else btn.textContent = "Follow a bus";
            if (activeCity === "Winnipeg") btn.textContent = "No public live feed";
        }

        function paintRide(s) {
            document.getElementById("ride-title").textContent = routeLabel(s.route, vehicleCity(s));
            const way = document.getElementById("ride-way");
            const stop = document.getElementById("ride-stop");
            const warn = document.getElementById("ride-warn");
            const notes = [];
            const agency = s.agency ? s.agency + " · " : "";
            if (s.toward) {
                const going = s.compass ? "Going " + s.compass.toLowerCase() + " toward " + s.toward : "Toward " + s.toward;
                document.getElementById("ride-sub").textContent = agency + going;
                way.textContent = s.other ? (s.other + "  →  " + s.toward) : "";
                notes.push("This bus is going to " + s.toward + "." + (s.other ? " The one coming the other way goes to " + s.other + ", and it stops across the street." : ""));
            } else if (s.compass) {
                document.getElementById("ride-sub").textContent = agency + "Heading " + s.compass.toLowerCase();
                way.textContent = "";
            } else {
                document.getElementById("ride-sub").textContent = agency + modeLabel(s.mode) + " · Live";
                way.textContent = "";
            }
            stop.textContent = s.stop || "";
            if (s.shortTurn) notes.push("This trip turns back early. It will not reach the far end of the route.");
            if (s.occupancy === "Full" || s.occupancy === "Packed" || s.occupancy === "Not boarding") {
                notes.push("This bus is " + s.occupancy.toLowerCase() + ". Let it pass.");
            } else if (s.occupancy) {
                notes.push(s.occupancy + ".");
            }
            if (s.bunched) notes.push("Another bus on this route is right beside this one.");
            if (s.alert) notes.push(s.alert);
            warn.textContent = notes.join(" ");
            document.getElementById("ride-speed").textContent = (s.shownKmh || 0).toFixed(0) + " km/h";
            document.getElementById("ride-head").textContent = s.compass || compass(s.bearing);
        }

        function paintFeed(age) {
            const el = document.getElementById("feed-age");
            const seconds = Number(age);
            if (!seconds || seconds < 25) {
                el.style.display = "none";
                el.textContent = "";
                return;
            }
            el.style.display = "block";
            el.classList.toggle("bad", seconds >= 60);
            el.textContent = seconds >= 60 ? "Feed is " + Math.round(seconds) + "s old" : "Feed " + Math.round(seconds) + "s";
        }

        function applyStats(message) {
            if (message.agencies) agencyStatus = message.agencies;
            const mine = agencyStatus[activeCity];
            if (mine && mine.feed_age_seconds != null) paintFeed(mine.feed_age_seconds);
            else if (activeCity === "Toronto" && message.feed_age_seconds != null) paintFeed(message.feed_age_seconds);
            else paintFeed(0);
            paintSheet();
        }

        function matchesPool(s) {
            if (vehicleCity(s) !== activeCity) return false;
            if (filterMode !== "all" && s.mode !== filterMode) return false;
            return matchesSearch(s);
        }

        function followNext() {
            const bounds = mapLoaded ? map.getBounds() : null;
            const pool = [];
            const anywhere = [];
            fleet.forEach(function (s) {
                if (!s.moving || !matchesPool(s)) return;
                if (!s.route || s.route === "Unknown") return;
                anywhere.push(s);
                if (!bounds || bounds.contains([s.lon, s.lat])) pool.push(s);
            });
            const choices = pool.length ? pool : anywhere;
            if (!choices.length) {
                showHint("No moving vehicles in this view yet");
                return;
            }
            choices.sort(function (a, b) { return b.speed - a.speed; });
            const idx = choices.findIndex(function (s) { return s.id === followId; });
            startFollow(choices[(idx + 1) % choices.length].id);
        }

        function startFollow(id) {
            const s = fleet.get(id);
            if (!s) return;
            followId = id;
            userTookCamera = false;
            cameraSettled = false;
            document.getElementById("recenter").hidden = true;
            document.getElementById("sheet").style.display = "none";
            document.getElementById("ride").style.display = "block";
            paintRide(s);
            if (mapLoaded) {
                map.setFilter("follow-halo", ["==", ["get", "id"], id]);
                flySafe({
                    center: [s.lon, s.lat],
                    zoom: FOLLOW_ZOOM,
                    bearing: s.bearing,
                    pitch: 64,
                    duration: 1500,
                    essential: true
                });
            }
        }

        function stopFollow(flyHome) {
            followId = null;
            userTookCamera = false;
            cameraSettled = false;
            document.getElementById("recenter").hidden = true;
            document.getElementById("ride").style.display = "none";
            document.getElementById("sheet").style.display = "block";
            if (mapLoaded) map.setFilter("follow-halo", ["==", ["get", "id"], ""]);
            if (flyHome !== false && mapLoaded) {
                if (query) fitQuery();
                else flySafe(cityCamera());
            }
        }

        function fitQuery() {
            const bounds = new maplibregl.LngLatBounds();
            let n = 0;
            fleet.forEach(function (s) {
                if (!matchesPool(s)) return;
                bounds.extend([s.lon, s.lat]);
                n++;
            });
            const hint = document.getElementById("hint");
            if (!query) {
                hint.style.display = "none";
                return;
            }
            const label = (picked && (picked.toward || picked.title)) || query;
            hint.style.display = "block";
            hint.textContent = n ? n + " vehicles · " + label : "Nothing live for " + label;
            if (n && mapLoaded && !followId) {
                map.fitBounds(bounds, { padding: { top: 150, bottom: 260, left: 40, right: 40 }, maxZoom: 16.2, pitch: 62, duration: 900 });
            }
        }

        function closeResults() {
            const box = document.getElementById("results");
            box.classList.remove("open");
            box.innerHTML = "";
            resultHits = [];
            document.getElementById("search").setAttribute("aria-expanded", "false");
        }

        function clearSearch() {
            query = "";
            picked = null;
            document.getElementById("search").value = "";
            document.getElementById("clear").hidden = true;
            document.querySelectorAll("#chips .chip").forEach(function (chip) { chip.classList.remove("on"); });
            closeResults();
        }

        function setQuery(value) {
            query = (value || "").trim();
            picked = query ? { kind: "route", city: activeCity, route: query, title: routeLabel(query, activeCity) } : null;
            document.getElementById("search").value = query ? routeLabel(query, activeCity) : "";
            document.getElementById("clear").hidden = !query;
            document.querySelectorAll("#chips .chip").forEach(function (chip) {
                chip.classList.toggle("on", chip.dataset.route === query);
            });
            closeResults();
            if (followId) stopFollow(false);
            if (!query) {
                showCityNote();
                flySafe(cityCamera());
                return;
            }
            fitQuery();
        }

        function suggest(text) {
            const q = (text || "").trim().toLowerCase();
            if (q.length < 1) return [];
            const hits = [];
            Object.keys(CITIES).forEach(function (city) {
                const info = CITIES[city];
                const agency = info.agency || "";
                if (city.toLowerCase().indexOf(q) === 0 || (q.length >= 2 && agency.toLowerCase().indexOf(q) !== -1)) {
                    hits.push({
                        kind: "city",
                        city: city,
                        title: city,
                        sub: agency + (info.live === false ? " · " + (info.note || "feed unavailable") : " · live"),
                        score: city.toLowerCase().indexOf(q) === 0 ? 100 : 80
                    });
                }
            });
            const groups = {};
            fleet.forEach(function (s) {
                const route = String(s.route || "");
                if (!route || route === "Unknown") return;
                const name = vehicleCity(s) === "Toronto" ? (ROUTE_NAMES[route] || "") : "";
                const label = (route + " " + name).trim().toLowerCase();
                const toward = s.toward || "";
                const stop = s.stop || "";
                let score = 0;
                let bucket = "";
                if (route && route.toLowerCase() === q) {
                    score = 95;
                    bucket = "route";
                } else if (q.length >= 2 && /^\d+$/.test(q) && route.toLowerCase().indexOf(q) === 0) {
                    score = 72;
                    bucket = "route";
                } else if (name && name.toLowerCase().indexOf(q) !== -1) {
                    score = 78;
                    bucket = "route";
                } else if (label.indexOf(q) === 0) {
                    score = 70;
                    bucket = "route";
                } else if (toward && toward.toLowerCase().indexOf(q) === 0) {
                    score = 64;
                    bucket = "dest";
                } else if (q.length >= 3 && toward && toward.toLowerCase().indexOf(q) !== -1) {
                    score = 50;
                    bucket = "dest";
                } else if (q.length >= 3 && stop && stop.toLowerCase().indexOf(q) !== -1) {
                    score = 36;
                    bucket = "stop";
                }
                if (!score) return;
                const city = vehicleCity(s);
                const place = stopPlace(stop);
                const key = bucket === "route" ? city + "|r|" + route
                    : bucket === "dest" ? city + "|d|" + route + "|" + toward
                    : city + "|s|" + place;
                const current = groups[key];
                if (!current) {
                    groups[key] = {
                        kind: bucket === "route" ? "route" : bucket === "dest" ? "destination" : "stop",
                        city: city,
                        route: bucket === "stop" ? "" : route,
                        toward: bucket === "dest" ? toward : "",
                        stop: bucket === "stop" ? place : "",
                        title: bucket === "dest" ? toward : bucket === "stop" ? place : routeLabel(route, city),
                        agency: s.agency || city,
                        score: score,
                        n: 1
                    };
                } else {
                    current.n += 1;
                    current.score = Math.max(current.score, score);
                }
            });
            Object.keys(groups).forEach(function (key) { hits.push(groups[key]); });
            hits.forEach(function (hit) {
                if (hit.kind === "city") return;
                const count = hit.n + (hit.n === 1 ? " vehicle" : " vehicles");
                if (hit.kind === "route") hit.sub = hit.agency + " · " + count;
                else if (hit.kind === "destination") hit.sub = hit.agency + " · route " + hit.route + " · " + count + " this way";
                else hit.sub = hit.agency + " · " + count + " near this stop";
            });
            hits.sort(function (a, b) {
                const order = { city: 0, route: 1, destination: 2, stop: 3 };
                return (order[a.kind] - order[b.kind]) || (b.score - a.score) || ((b.n || 0) - (a.n || 0));
            });
            return hits.slice(0, 8);
        }

        function paintResults(text) {
            const box = document.getElementById("results");
            const hits = suggest(text);
            resultHits = hits;
            resultIndex = 0;
            box.innerHTML = "";
            if (!(text || "").trim()) {
                closeResults();
                return;
            }
            if (!hits.length) {
                const empty = document.createElement("div");
                empty.className = "result empty";
                empty.textContent = "No routes, stops, or cities match";
                box.appendChild(empty);
                box.classList.add("open");
                document.getElementById("search").setAttribute("aria-expanded", "true");
                return;
            }
            hits.forEach(function (hit, i) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "result" + (i === 0 ? " on" : "");
                btn.setAttribute("role", "option");
                const title = document.createElement("b");
                title.textContent = hit.title;
                const sub = document.createElement("span");
                sub.textContent = hit.sub || "";
                btn.appendChild(title);
                btn.appendChild(sub);
                btn.addEventListener("mousedown", function (e) { e.preventDefault(); });
                btn.addEventListener("click", function () { commitHit(hit); });
                box.appendChild(btn);
            });
            box.classList.add("open");
            document.getElementById("search").setAttribute("aria-expanded", "true");
        }

        function moveResult(step) {
            if (!resultHits.length) return;
            resultIndex = (resultIndex + step + resultHits.length) % resultHits.length;
            document.querySelectorAll("#results .result").forEach(function (el, i) {
                el.classList.toggle("on", i === resultIndex);
            });
        }

        function commitHit(hit) {
            closeResults();
            if (!hit) return;
            if (hit.kind === "city") {
                clearSearch();
                goCity(hit.city, true);
                return;
            }
            goCity(hit.city, false);
            query = hit.route || hit.stop || "";
            picked = {
                kind: hit.kind,
                city: hit.city,
                route: hit.route || "",
                toward: hit.toward || "",
                stop: hit.stop || "",
                title: hit.title
            };
            document.getElementById("search").value = hit.title;
            document.getElementById("clear").hidden = false;
            document.querySelectorAll("#chips .chip").forEach(function (chip) {
                chip.classList.toggle("on", chip.dataset.route === query && !picked.toward);
            });
            if (followId) stopFollow(false);
            fitQuery();
        }

        function setLive(on) {
            const el = document.getElementById("live");
            el.classList.toggle("off", !on);
            document.getElementById("live-label").textContent = on ? "LIVE" : "CONNECTING";
        }

        function showHint(text) {
            const hint = document.getElementById("hint");
            hint.style.display = "block";
            hint.textContent = text;
            clearTimeout(showHint._t);
            showHint._t = setTimeout(function () {
                if (!query) showCityNote();
            }, 2400);
        }

        const map = new maplibregl.Map({
            container: "map",
            style: uberStyle,
            center: HERO.center,
            zoom: HERO.zoom,
            pitch: HERO.pitch,
            bearing: HERO.bearing,
            maxPitch: 78,
            minZoom: 2.4,
            maxZoom: 18.5,
            attributionControl: true,
            fadeDuration: 0
        });
        map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), "bottom-right");

        function bootFleet() {
            if (map.getLayer("vehicles")) return;
            const narrow = window.matchMedia("(max-width: 720px)").matches;
            map.setPadding({ top: narrow ? 148 : 110, bottom: narrow ? 280 : 230, left: 12, right: narrow ? 12 : 16 });
            map.setLight({ anchor: "viewport", color: "#ffffff", intensity: 0.65, position: [1.2, 160, 45] });
            ["bus", "streetcar", "express", "stopped"].forEach(function (kind) {
                const canvas = vehicleCanvas(kind);
                const image = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height);
                map.addImage("veh-" + kind, image, { pixelRatio: 2 });
            });
            map.addSource("fleet", { type: "geojson", data: collection });
            map.addLayer({
                id: "follow-halo",
                type: "circle",
                source: "fleet",
                filter: ["==", ["get", "id"], ""],
                paint: {
                    "circle-radius": 13,
                    "circle-color": "rgba(255,255,255,0.14)",
                    "circle-stroke-width": 2,
                    "circle-stroke-color": "#ffffff",
                    "circle-pitch-alignment": "viewport",
                    "circle-pitch-scale": "viewport"
                }
            });
            map.addLayer({
                id: "vehicles",
                type: "symbol",
                source: "fleet",
                filter: ["==", ["get", "show"], 1],
                layout: {
                    "icon-image": ["get", "icon"],
                    "icon-size": ["interpolate", ["linear"], ["zoom"], 12, 0.7, 15, 0.85, 17, 1, 18.5, 1.1],
                    "icon-rotate": 0,
                    "icon-rotation-alignment": "viewport",
                    "icon-pitch-alignment": "viewport",
                    "icon-allow-overlap": true,
                    "icon-ignore-placement": true
                }
            });
            map.on("click", "vehicles", function (e) {
                const id = e.features && e.features[0] && e.features[0].properties.id;
                if (id) startFollow(String(id));
            });
            map.on("mouseenter", "vehicles", function () { map.getCanvas().style.cursor = "pointer"; });
            map.on("mouseleave", "vehicles", function () { map.getCanvas().style.cursor = ""; });
            mapLoaded = true;
        }
        map.on("load", bootFleet);
        if (map.isStyleLoaded()) bootFleet();

        function onUserMove(e) {
            if (e.originalEvent && followId) {
                userTookCamera = true;
                cameraSettled = false;
                document.getElementById("recenter").hidden = false;
            }
        }
        map.on("dragstart", onUserMove);
        map.on("zoomstart", onUserMove);
        map.on("rotatestart", onUserMove);
        map.on("pitchstart", onUserMove);
        map.on("moveend", function () {
            if (followId && !userTookCamera) cameraSettled = true;
        });
        map.on("error", function (e) {
            console.error(e && e.error ? e.error : e);
        });

        document.getElementById("follow-btn").addEventListener("click", followNext);
        document.getElementById("ride-close").addEventListener("click", function () { stopFollow(true); });
        document.getElementById("recenter").addEventListener("click", function () {
            if (!followId) return;
            userTookCamera = false;
            cameraSettled = false;
            document.getElementById("recenter").hidden = true;
            const s = fleet.get(followId);
            if (s) {
                flySafe({ center: [s.lon, s.lat], zoom: FOLLOW_ZOOM, bearing: s.bearing, pitch: 64, duration: 700, essential: true });
            }
        });
        document.getElementById("search").addEventListener("input", function (e) {
            document.getElementById("clear").hidden = !e.target.value;
            paintResults(e.target.value);
        });
        document.getElementById("search").addEventListener("keydown", function (e) {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                moveResult(1);
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                moveResult(-1);
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (resultHits.length) commitHit(resultHits[resultIndex] || resultHits[0]);
                else followNext();
            } else if (e.key === "Escape") {
                closeResults();
            }
        });
        document.getElementById("clear").addEventListener("click", function () {
            clearSearch();
            if (followId) stopFollow(false);
            showCityNote();
            flySafe(cityCamera());
        });
        document.addEventListener("click", function (e) {
            if (!e.target.closest(".where") && !e.target.closest("#results")) closeResults();
        });
        function flySafe(options) {
            if (!mapLoaded) return;
            map.setTerrain(null);
            map.once("moveend", function () {
                map.setTerrain({ source: "terrain", exaggeration: 1.35 });
            });
            map.flyTo(options);
        }

        function cityCamera() {
            const city = CITIES[activeCity] || CITIES.Toronto;
            return {
                center: city.center,
                zoom: city.zoom,
                pitch: city.pitch,
                bearing: city.bearing,
                duration: 1200,
                essential: true
            };
        }

        function renderRoutes() {
            const box = document.getElementById("chips");
            const routes = (CITIES[activeCity] && CITIES[activeCity].routes) || [];
            box.innerHTML = "";
            box.style.display = routes.length ? "" : "none";
            routes.forEach(function (route) {
                const btn = document.createElement("button");
                btn.className = "chip";
                btn.type = "button";
                btn.dataset.route = route.id;
                btn.textContent = route.label;
                box.appendChild(btn);
            });
        }

        function syncFilters() {
            const street = document.querySelector('[data-mode="streetcar"]');
            const express = document.querySelector('[data-mode="express"]');
            if (activeCity === "Calgary") {
                street.hidden = false;
                street.textContent = "Train";
            } else if (activeCity === "Toronto") {
                street.hidden = false;
                street.textContent = "Streetcar";
            } else {
                street.hidden = true;
            }
            express.hidden = activeCity !== "Toronto";
            if (street.hidden && filterMode === "streetcar") filterMode = "all";
            if (express.hidden && filterMode === "express") filterMode = "all";
            document.querySelectorAll(".filter").forEach(function (el) {
                el.classList.toggle("on", el.dataset.mode === filterMode);
            });
        }

        function showCityNote() {
            const city = CITIES[activeCity] || {};
            const hint = document.getElementById("hint");
            if (city.note && !query) {
                hint.style.display = "block";
                hint.textContent = city.note;
                return;
            }
            if (!query) hint.style.display = "none";
        }

        function goCity(name, fly) {
            const city = CITIES[name];
            if (!city) return;
            activeCity = name;
            document.querySelectorAll("#cities .chip").forEach(function (el) {
                el.classList.toggle("on", el.dataset.city === name);
            });
            if (followId) stopFollow(false);
            userTookCamera = false;
            syncFilters();
            renderRoutes();
            paintSheet();
            if (fly !== false) {
                showCityNote();
                flySafe(cityCamera());
            }
        }

        document.getElementById("cities").addEventListener("click", function (e) {
            const btn = e.target.closest("[data-city]");
            if (!btn || !CITIES[btn.dataset.city]) return;
            clearSearch();
            goCity(btn.dataset.city, true);
        });
        document.getElementById("chips").addEventListener("click", function (e) {
            const btn = e.target.closest(".chip");
            if (!btn) return;
            setQuery(query === btn.dataset.route ? "" : btn.dataset.route);
        });
        document.querySelectorAll(".filter").forEach(function (btn) {
            btn.addEventListener("click", function () {
                filterMode = btn.dataset.mode;
                document.querySelectorAll(".filter").forEach(function (el) { el.classList.toggle("on", el === btn); });
                paintSheet();
            });
        });
        const menu = document.getElementById("menu");
        document.getElementById("menu-btn").addEventListener("click", function (e) {
            e.stopPropagation();
            menu.classList.toggle("open");
        });
        document.addEventListener("click", function (e) {
            if (!menu.contains(e.target)) menu.classList.remove("open");
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                menu.classList.remove("open");
                if (followId) stopFollow(true);
            }
        });

        function loadSnapshot() {
            fetch("/api/transit/vehicles?limit=8000")
                .then(function (res) { return res.json(); })
                .then(function (data) { ingest(data.vehicles || [], true); })
                .catch(function () {});
            fetch("/api/transit/stats")
                .then(function (res) { return res.json(); })
                .then(applyStats)
                .catch(function () {});
        }

        function connect() {
            const proto = location.protocol === "https:" ? "wss:" : "ws:";
            const socket = new WebSocket(proto + "//" + location.host + "/ws/transit");
            socket.onopen = function () {
                setLive(true);
                loadSnapshot();
            };
            socket.onmessage = function (event) {
                let message;
                try { message = JSON.parse(event.data); } catch (err) { return; }
                applyStats(message);
                if (message.vehicles && message.vehicles.length) {
                    const full = message.full === true || (message.active_vehicles && message.vehicles.length >= message.active_vehicles * 0.9);
                    ingest(message.vehicles, full);
                }
            };
            socket.onclose = function () {
                setLive(false);
                setTimeout(connect, 2000);
            };
        }

        renderRoutes();
        syncFilters();
        requestAnimationFrame(tick);
        connect();
    </script>
</body>
</html>
